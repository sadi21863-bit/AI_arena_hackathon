name: Manual Build Test (single harness-testing turn)

# Manual fire-one-turn harness test (renamed from spike-turn.yml 2026-09-20;
# the August one-shot verification it was built for is long done). Dispatch
# by hand with any turn_id/task_prompt to exercise the SAME hardened
# pipeline as production turns (team-build-turn.yml) without touching a
# live event: useful after harness edits, before trusting the next
# autonomous dispatch. Runs against THIS repo (it checks out and builds
# whatever repo dispatches it — dispatch from a team repo to test there).
#
# Legacy waiting infrastructure below (Workers AI quota probe + <=5h45m
# self-redispatch chain) dates from when builds ran on Workers AI and a
# 429 mid-test meant a false result. Builds run on Zen now, so the probe
# usually passes instantly and the chain never engages; kept as-is rather
# than deleted because a manual test that waits out a real outage is still
# the safer default for a file whose whole job is producing trustworthy
# single samples.

on:
  workflow_dispatch:
    inputs:
      turn_id:
        description: "Turn id for log correlation (any string)"
        required: false
        default: manual-test-001
      task_prompt:
        description: "What the test turn's agent should work on"
        required: false
        default: >-
          Harness smoke test against the arena repo itself. Real task (no
          production behavior changes): run the repo's own gates
          (npx tsc --noEmit) and report the result. Change nothing — on a
          green repo the turn should fail the real-output gate, which
          itself proves the gate works. Follow the standard build-turn
          discipline: plan, implement, self-verify, then commit.
      model:
        description: "Model override for the test turn (empty = workflow default)"
        required: false
        default: ""

concurrency:
  group: manual-build-test-${{ inputs.turn_id || 'manual-test-001' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

jobs:
  manual_test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for Workers AI quota, then run the test turn
        env:
          TASK_PROMPT: ${{ inputs.task_prompt }}
          TURN_ID: ${{ inputs.turn_id || 'manual-test-001' }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/v1/chat/completions"
          probe() {
            curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST "$API" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d '{"model":"@cf/openai/gpt-oss-120b","messages":[{"role":"user","content":"ok"}],"max_tokens":3}' || echo 000
          }
          dispatch() { # $1 = workflow file
            # Team repos default to main, this management repo to master
            # (found live 2026-07-21: hardcoded master 422s on team repos).
            REF=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}" | jq -r .default_branch)
            payload=$(jq -n --arg ref "$REF" --arg turn "$TURN_ID" --arg prompt "$TASK_PROMPT" --arg model "$MODEL" \
              '{ref:$ref, inputs:{team:"alpha", turn_id:$turn, task_prompt:$prompt, model:$model}}')
            curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$1/dispatches" \
              -d "$payload"
          }
          BUDGET_MIN=330
          WAITED_MIN=0
          code=$(probe)
          while [ "$code" != "200" ] && [ "$WAITED_MIN" -lt "$BUDGET_MIN" ]; do
            echo "[wait] waited ${WAITED_MIN}/${BUDGET_MIN} min — quota HTTP ${code}, sleeping 5 min"
            sleep 300
            WAITED_MIN=$((WAITED_MIN + 5))
            code=$(probe)
          done
          if [ "$code" != "200" ]; then
            echo "::warning::quota still exhausted after ${BUDGET_MIN} min (HTTP ${code}) — dispatching a successor test run to continue the wait chain; only the final run executes the turn"
            hc=$(dispatch "manual-build-test.yml")
            echo "successor dispatch HTTP ${hc}"
            exit 0
          fi
          echo "quota free (HTTP ${code}) — dispatching the real test turn"
          hc=$(dispatch "team-build-turn.yml")
          echo "turn dispatch HTTP ${hc}"
          # Poll the team-build-turn run for this turn_id to completion.
          RUNS="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/team-build-turn.yml/runs?per_page=10"
          RUN_ID=""
          for _ in $(seq 1 36); do
            sleep 10
            RUN_ID=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' "$RUNS" \
              | jq -r --arg turn "$TURN_ID" '.workflow_runs[] | select(.display_title | contains($turn)) | select(.status != "in_progress") | .id' | head -1)
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::could not find a completed team-build-turn run for $TURN_ID — check the Actions tab for the dispatched run"
            exit 1
          fi
          DETAIL=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          CONC=$(echo "$DETAIL" | jq -r '.conclusion // "unknown"')
          URL=$(echo "$DETAIL" | jq -r '.html_url')
          echo "test turn run ${RUN_ID}: conclusion=${CONC} url=${URL}"
          if [ "$CONC" = "success" ]; then
            echo "TEST PASSED — turn ${TURN_ID} completed successfully. See ${URL}"
            exit 0
          fi
          echo "::error::test turn ${TURN_ID} concluded ${CONC} — see ${URL}"
          exit 1