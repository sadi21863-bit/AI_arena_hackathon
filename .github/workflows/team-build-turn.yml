name: Team Build Turn

# The run title carries turn_id because the Actions API cannot be queried by
# workflow_dispatch input — listing runs is the only way to find one, and
# without the id in the title there is no way to tell which run belongs to
# which dispatched turn. reconcileBuildTurns (src/events/scheduler.ts) matches
# on this string, so changing the format means changing that matcher too.
run-name: >-
  Build turn ${{ github.event.inputs.turn_id || github.event.client_payload.turn_id }}
  (${{ github.event.inputs.team || github.event.client_payload.team }})

# Spec §8. Triggered by the Cloudflare Worker via the GitHub API
# (workflow_dispatch or repository_dispatch, per §8) once per agent build
# turn — NOT continuously. Each run is a fresh, isolated VM (4 CPU / 16GB RAM
# on public repos, confirmed from GitHub's own runner docs) that checks out
# the repo, builds, commits, and exits. Git history is the persistence layer
# between turns.
#
# Agent driver: OpenCode (opencode.ai), confirmed real/active/MIT-licensed,
# with a documented non-interactive `opencode run` command meant for exactly
# this kind of scripted CI use, and a custom-provider config path
# (docker/opencode.json, OPENCODE_CONFIG) for pointing it at Workers AI
# instead of a natively-supported provider. This replaces what would
# otherwise be custom-built agent-loop code.

on:
  workflow_dispatch:
    inputs:
      team:
        description: "Which team's build (alpha or beta)"
        required: true
        type: choice
        options: [alpha, beta]
      turn_id:
        description: "Opaque turn identifier from the event engine, for log correlation"
        required: true
        type: string
      task_prompt:
        description: "What this turn's agent should work on"
        required: true
        type: string
  repository_dispatch:
    types: [team-build-turn]

concurrency:
  group: build-turn-${{ github.event.inputs.team || github.event.client_payload.team }}
  cancel-in-progress: false

# The default GITHUB_TOKEN is read-only unless a repo/org's Actions settings
# override it — don't rely on that being set globally, since a fresh repo
# won't have it. Declare write access explicitly so "Commit progress"'s
# `git push` (spec §8) works regardless of the repo-level default.
permissions:
  contents: write

jobs:
  build-turn:
    runs-on: ubuntu-latest # 4 CPU / 16GB RAM / 14GB SSD on public repos, confirmed July 2026
    timeout-minutes: 120 # well under the 6-hour hard cap; a single turn should never need this long
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Workers AI, not Groq, runs the agent-work step below: OpenCode's own
      # baseline request (system prompt + tool schemas) measures ~32-38K
      # tokens, which exceeds every Groq free-tier model's TPM cap (max 12K,
      # spec §5) on the very first call. Workers AI's 10K Neurons/day is a
      # daily budget, not a per-minute token throttle, so it doesn't hit the
      # same wall. GROQ_API_KEY above stays wired for whatever still uses it
      # directly (§6 router, once Week 1 lands) — it's just not what
      # opencode calls in this step anymore.
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Checkout team repo at current state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build team base image
        # arena-team-base:latest doesn't persist between jobs (each run is a
        # fresh VM), so it's built fresh here from docker/Dockerfile.arena-team-base
        # every turn. If this step's ~10-20s becomes a real cost across many
        # turns, push the built image to GHCR once and pull it here instead.
        run: docker build -t arena-team-base:latest -f docker/Dockerfile.arena-team-base docker/

      - name: Start egress-filtering proxy (spec §7 network scoping)
        # Found live (2026-07-22 code review): the previous "SCOPED" comment
        # on Phase A was aspirational — the docker run below it had no actual
        # network restriction, full open egress, while injecting CF_API_TOKEN
        # into a container running an AI agent with --auto (self-approving)
        # against arbitrary prompts. Real secret-exfiltration risk.
        #
        # Real fix, not just a corrected comment: a Squid forward proxy on
        # the RUNNER (not inside the sandboxed container) with a domain
        # allowlist, combined with Docker's documented DOCKER-USER iptables
        # chain (https://docs.docker.com/engine/network/packet-filtering-firewalls/)
        # to DROP any container-originated traffic on 80/443 that doesn't go
        # through the proxy. Even if something inside the container ignores
        # the HTTP_PROXY/HTTPS_PROXY env vars set below (a compromised npm
        # postinstall script, Node's built-in fetch, etc.), it physically
        # cannot reach the internet directly — DOCKER-USER rules apply to all
        # container traffic, they're not something a process inside the
        # container can opt out of.
        #
        # Only package registries are allowed now: registry.npmjs.org for
        # whatever the coding agent's own build needs to npm install, plus
        # pypi.org/files.pythonhosted.org for the Phase B dependency-install
        # step, so Python-stack team repos can pip install. api.cloudflare.com
        # was removed when the Workers AI shim landed below: the container no
        # longer talks to Cloudflare at all, it talks to the shim on the
        # runner, so leaving Cloudflare allowlisted would only widen egress
        # for no reason.
        # github.com/api.github.com are deliberately NOT allowlisted — the
        # "Commit progress" step below does git push from the RUNNER, outside
        # any container, so nothing inside Phase A's container legitimately
        # needs GitHub access at all.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squid
          sudo tee /etc/squid/squid.conf > /dev/null <<'EOF'
          http_port 3128
          acl allowed_ssl_ports port 443
          acl CONNECT method CONNECT
          acl allowed_domains dstdomain .registry.npmjs.org .pypi.org .files.pythonhosted.org
          http_access allow CONNECT allowed_domains allowed_ssl_ports
          http_access allow allowed_domains
          http_access deny all
          EOF
          sudo systemctl restart squid
          # DOCKER-USER: Docker's own hook chain for custom container-egress
          # firewall rules — inserted rules here apply to traffic FORWARDED
          # through docker's bridge (i.e. from containers), not to the
          # runner/host's own traffic, so the proxy itself (running on the
          # host, not in a container) is unaffected by these DROP rules.
          sudo iptables -I DOCKER-USER -p tcp --dport 443 -j DROP
          sudo iptables -I DOCKER-USER -p tcp --dport 80 -j DROP

      - name: Start Workers AI compatibility shim (P0-0a)
        # Fixes the crash that killed every build turn mid-run:
        # `AI_InvalidResponseDataError: Expected 'id' to be a string.`
        #
        # docs/INVESTIGATION_2026-07-28.md guessed this was sandbox-specific
        # because one un-sandboxed local run passed. It isn't. The error comes
        # from the Vercel AI SDK, which validates tool_calls[].id as a string
        # per the OpenAI spec, and Cloudflare's 2026-02-17 change ("preserves
        # original tool call IDs from models instead of regenerating them")
        # means whatever gpt-oss-120b emits now reaches the client raw. It is
        # a per-tool-call property of model output, so it is nondeterministic
        # — which is why it struck on the ~5th tool call and why a single
        # clean local run proved nothing.
        #
        # The shim normalizes those ids (and the assistant `content: null`
        # incompatibility found in the same investigation) and holds
        # CF_API_TOKEN itself, so the --auto agent's container never receives
        # the credential the egress filtering above exists to protect.
        #
        # Logs go to $RUNNER_TEMP, deliberately NOT into the workspace: any
        # file the shim wrote there would show up in "Enforce real build
        # output"'s `git status` and make a do-nothing turn look like it
        # produced changes, defeating the very guard that catches a no-op
        # agent. nohup + redirect also stops the backgrounded process from
        # holding this step's stdout open, which can hang the step.
        run: |
          nohup node scripts/workers_ai_shim.js > "$RUNNER_TEMP/shim.log" 2>&1 &
          for _ in $(seq 1 30); do
            # -s (not -sf): the shim answering with any HTTP status means it is
            # up. Only a refused connection is worth waiting out.
            if curl -s -o /dev/null -m 2 http://127.0.0.1:3129/v1/models; then
              echo "shim reachable on 3129"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Workers AI shim never became reachable on 3129"
          cat "$RUNNER_TEMP/shim.log" || true
          exit 1

      - name: "Phase A — agent work (network-scoped to the shim + registry.npmjs.org)"
        # HOME=/tmp below: OpenCode (Bun) writes its config/cache to
        # $HOME/.local on startup; the read-only rootfs has no writable
        # /home, so it needs to land inside the tmpfs already mounted at /tmp.
        #
        # --user "$(id -u):$(id -g)" (not a hardcoded 1000:1000): /workspace
        # is bind-mounted from the runner's checkout, owned by the runner's
        # actual uid — a mismatched uid can't write into it even though the
        # bind mount itself is :rw, since real file-mode bits still apply.
        # Still never uid 0, so the non-root intent (spec §7) holds either way.
        #
        # --add-host=host.docker.internal:host-gateway + HTTP(S)_PROXY: routes
        # the container's outbound HTTP/HTTPS through the Squid proxy started
        # above (which runs on the runner host, reachable via the Docker-
        # provided host-gateway alias) — the DOCKER-USER DROP rules block any
        # attempt to bypass it and go direct.
        #
        # NO_PROXY includes host.docker.internal so the shim call goes direct
        # rather than being bounced through Squid (which no longer allowlists
        # Cloudflare anyway).
        #
        # CF_ACCOUNT_ID/CF_API_TOKEN are deliberately NOT passed in any more —
        # the shim on the runner holds them. The container gets only a
        # placeholder key, because @ai-sdk/openai-compatible requires the
        # option to be non-empty.
        #
        # `set +e` + explicit exit-code capture: a crash partway through a
        # turn still leaves real files on disk, and git history is the
        # persistence layer between turns (spec §8). Failing the step here
        # threw that work away and re-ran the same turn from scratch. The
        # acceptance check below still fails a genuinely empty turn; this only
        # stops a late crash from discarding work that did happen.
        #
        # Self-healing watchdog (2026-08-15, docs/INVESTIGATION_2026-08-15.md):
        # turns 15-18 (alpha) and 14-17 (beta) burned the full 120-min job
        # timeout producing ZERO bytes of agent output — the first model call
        # hung forever and only the job's hard cap ended the turn, which then
        # reconciled as a 'cancelled' run. Two fixes:
        #
        #   (1) scripts/workers_ai_shim.js now times out a stalled upstream
        #       api.cloudflare.com call (SHIM_UPSTREAM_TIMEOUT_MS, default
        #       180s) so opencode sees a real error within minutes and either
        #       retries or exits with a diagnosable failure. This is the root
        #       cause fix.
        #
        #   (2) This watchdog is the belt-and-suspenders: the container runs
        #       in the background while this step watches the turn logs AND
        #       the working tree. If neither grows for
        #       WATCHDOG_SILENCE_MINUTES (default 10), the agent is hung —
        #       healthy agents emit a JSON event every 1-5s (measured: max
        #       inter-event gap 17.6s on the one successful turn). Kill the
        #       container, fail the turn FAST, so it records a real 'failure'
        #       (never a silent 'cancelled') and the scheduler dispatches the
        #       next turn minutes later instead of 120 minutes later.
        id: agent
        run: |
          set +e
          CONTAINER="arena-agent-${{ github.run_id }}"
          WATCHDOG_SILENCE_MINUTES="${WATCHDOG_SILENCE_MINUTES:-10}"

          docker run --rm --name "$CONTAINER" \
            --cpus="2" --memory="4g" --memory-swap="4g" --pids-limit=100 \
            --read-only \
            --tmpfs /tmp:noexec,nosuid,size=500m,mode=1777 \
            --user="$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges:true \
            --add-host=host.docker.internal:host-gateway \
            -e HTTP_PROXY=http://host.docker.internal:3128 \
            -e HTTPS_PROXY=http://host.docker.internal:3128 \
            -e NO_PROXY=localhost,127.0.0.1,host.docker.internal \
            -e ARENA_AI_BASE_URL=http://host.docker.internal:3129/v1 \
            -e ARENA_AI_API_KEY=shim-injects-the-real-credential \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/workspace:rw" \
            -w /workspace \
            arena-team-base:latest \
            opencode run "${{ inputs.task_prompt || github.event.client_payload.task_prompt }}" \
              --model workers-ai/@cf/openai/gpt-oss-120b \
              --auto \
              --format json > opencode-turn.log 2> opencode-turn.err.log &
          DOCKER_PID=$!

          LAST_BYTES=0
          LAST_CHANGED=0
          LAST_ACTIVE=$(date +%s)
          TIMED_OUT=0
          # Loop on the CONTAINER's state, not `kill -0 $DOCKER_PID`: a
          # backgrounded process that has exited stays a zombie until `wait`,
          # and kill -0 keeps succeeding on a zombie — so that test would never
          # see a normally-finished turn and the watchdog would wrongly fire.
          while [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ]; do
            sleep 30
            BYTES=$(( $(wc -c < opencode-turn.log 2>/dev/null || echo 0) + $(wc -c < opencode-turn.err.log 2>/dev/null || echo 0) ))
            # File changes count as liveness only when the WORKING SET grows
            # or shrinks — not merely being non-empty, or one write would keep
            # a then-hung agent marked alive forever. The count (not a hash)
            # misses same-file edits, but the BYTES signal covers those:
            # opencode emits a JSON event per step, so a working agent grows
            # the log constantly regardless of which file it edits.
            CHANGED=$(git status --porcelain -- . ':!opencode-turn.log' ':!opencode-turn.err.log' 2>/dev/null | wc -l)
            NOW=$(date +%s)
            if [ "$BYTES" != "$LAST_BYTES" ] || [ "${CHANGED:-0}" != "$LAST_CHANGED" ]; then
              LAST_BYTES=$BYTES
              LAST_CHANGED=${CHANGED:-0}
              LAST_ACTIVE=$NOW
            fi
            if [ $(( NOW - LAST_ACTIVE )) -ge $(( WATCHDOG_SILENCE_MINUTES * 60 )) ]; then
              echo "::error::Agent silent for ${WATCHDOG_SILENCE_MINUTES} min (no output, no file changes) — killing container ${CONTAINER}"
              docker kill "$CONTAINER" 2>/dev/null || true
              TIMED_OUT=1
              break
            fi
          done
          wait "$DOCKER_PID"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "timed_out=$TIMED_OUT" >> "$GITHUB_OUTPUT"
          if [ "$TIMED_OUT" = "1" ]; then
            echo "opencode was killed by the silence watchdog after ${WATCHDOG_SILENCE_MINUTES} min of no activity (exit ${code})"
          else
            echo "opencode exited $code"
          fi
          exit 0
        # --auto approves OpenCode's own permission prompts (needed since
        # there's no human to click "yes" in CI) — the container's cap-drop
        # and non-root user are what actually bound what --auto can do, not
        # OpenCode's own permission system alone. --format json makes the log
        # machine-parseable for the Observatory (spec §11) instead of just
        # human-readable TUI output.

      - name: Show turn log (debug)
        if: always()
        # stderr is captured separately now. Phase A previously redirected
        # only stdout, so when opencode crashed the actual diagnostic went to
        # the void and the failure had to be reconstructed from the JSON
        # stream — a large part of why P0-0a took as long as it did to pin
        # down. --format json means stdout must stay pure, hence two files
        # rather than 2>&1.
        run: |
          echo "--- stdout ---"
          cat opencode-turn.log 2>/dev/null || echo "opencode-turn.log not found"
          echo "--- stderr ---"
          cat opencode-turn.err.log 2>/dev/null || echo "opencode-turn.err.log not found"
          echo "--- shim ---"
          cat "$RUNNER_TEMP/shim.log" 2>/dev/null || echo "shim.log not found"
          echo "--- crash signature (empty means the P0-0a id bug did not recur) ---"
          grep -iE "expected 'id'|InvalidResponseData|upstream error|timed out after|shim upstream" \
            opencode-turn.log opencode-turn.err.log "$RUNNER_TEMP/shim.log" 2>/dev/null || true

      - name: Enforce real build output
        # Found live (see docs/INVESTIGATION_2026-07-28.md P0-0a / NEW-1): a
        # build turn can emit a text essay, invoke zero tools, write zero
        # files, and still exit 0 — `opencode run` succeeding only means the
        # CLI didn't crash, not that any work happened. This was the actual
        # gap behind build_pipeline's gate passing while both closed-beta
        # team repos ended up with no product code. Fail here, before Phase B
        # or the commit step, so a no-op turn is reported as a failure
        # instead of a silent success.
        run: |
          CHANGED=$(git status --porcelain -- . ':!opencode-turn.log' ':!opencode-turn.err.log')
          if [ -z "$CHANGED" ]; then
            echo "::error::Build turn produced no file changes outside the turn logs — the agent emitted text without writing any files. Failing the job instead of reporting a false success."
            exit 1
          fi
          echo "Files changed this turn:"
          echo "$CHANGED"

      - name: Phase B — install dependencies (network-scoped to package registries)
        # The verification step below runs --network=none, so dependencies
        # must already exist in the workspace before it starts. Installed here
        # in a container with the SAME scoped egress as Phase A (Squid proxy +
        # DOCKER-USER DROP rules; only npmjs.org + PyPI are allowlisted):
        # npm -> node_modules/, pip -> ./.pydeps (the image rootfs is
        # --read-only, so pip cannot write system site-packages — PYTHONPATH
        # points the verification step at .pydeps instead). node_modules/ and
        # .pydeps/ are .gitignore'd so vendored deps never land in the team
        # repo.
        #
        # set +e + explicit exit-code capture + exit 0: a broken install must
        # not skip the "Commit progress" step below — the turn's work is
        # preserved regardless, and the failure is surfaced by the verification
        # step (via INSTALL_EXIT_CODE) and the final "Report verification
        # failure" step, so the turn records as 'failure' (executed, judged),
        # never as lost work.
        id: install
        run: |
          set +e
          # Bounded retry (whole-arena sim finding, docs/ARCHITECTURE_COMPARISON.md
          # A6: one-shot flaky verification cost ~10pp end-to-end winner accuracy
          # — a single transient registry/network hiccup flipped a turn to
          # 'failure' that a retry would have passed, and over a multi-turn event
          # that compounds into wrong winners). npm ci / pip install over the
          # Squid proxy are the transient-failure-prone steps; a REAL install
          # error (bad requirement, missing package) fails identically on all
          # attempts and still surfaces via INSTALL_EXIT_CODE below.
          ATTEMPTS=3
          code=0
          for attempt in $(seq 1 $ATTEMPTS); do
            docker run --rm \
              --cpus="2" --memory="4g" --memory-swap="4g" --pids-limit=100 \
              --read-only \
              --tmpfs /tmp:noexec,nosuid,size=500m,mode=1777 \
              --user="$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges:true \
              --add-host=host.docker.internal:host-gateway \
              -e HTTP_PROXY=http://host.docker.internal:3128 \
              -e HTTPS_PROXY=http://host.docker.internal:3128 \
              -e NO_PROXY=localhost,127.0.0.1,host.docker.internal \
              -e HOME=/tmp \
              -v "${{ github.workspace }}:/workspace:rw" \
              -w /workspace \
              arena-team-base:latest \
              sh -c 'set +e
              FAILED=0
              if [ -f package.json ]; then
                echo "--- dependency install: npm ---"
                if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                  echo "lockfile found -> npm ci"
                  npm ci --no-audit --no-fund || FAILED=1
                else
                  echo "no lockfile -> npm install"
                  npm install --no-audit --no-fund || FAILED=1
                fi
              elif [ -f requirements.txt ]; then
                echo "--- dependency install: pip (requirements.txt) ---"
                python3 -m pip install --disable-pip-version-check --no-cache-dir --target /workspace/.pydeps -r requirements.txt || FAILED=1
              elif [ -f pyproject.toml ]; then
                echo "--- dependency install: pip (pyproject.toml) ---"
                python3 -m pip install --disable-pip-version-check --no-cache-dir --target /workspace/.pydeps . > /tmp/pip-project.log 2>&1
                code=$?
                if [ $code -ne 0 ] && grep -q "does not appear to be a Python project" /tmp/pip-project.log; then
                  echo "::warning::pyproject.toml is not a Python package (no build-system) — nothing to install from it"
                elif [ $code -ne 0 ]; then
                  cat /tmp/pip-project.log
                  FAILED=1
                fi
              else
                echo "no package.json, requirements.txt or pyproject.toml — no dependencies to install"
              fi
              touch .gitignore
              grep -qF "node_modules/" .gitignore || echo "node_modules/" >> .gitignore
              grep -qF "/.pydeps/" .gitignore || echo "/.pydeps/" >> .gitignore
              echo "install phase FAILED=$FAILED"
              exit $FAILED'
            code=$?
            if [ $code -eq 0 ]; then
              echo "install container succeeded on attempt $attempt"
              break
            fi
            echo "install attempt $attempt of $ATTEMPTS failed (exit $code) — retrying; a real install error fails all attempts, this only absorbs transient registry/network hiccups"
            sleep 10
          done
          echo "install container exited $code (0 = deps present, 1 = install failed after $ATTEMPTS attempts)"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Phase B — locked-down verification (network=none)
        # This step runs fully --network=none — it runs AFTER the agent's
        # network-needing work AND after the install step above (the only step
        # that touches package registries), building and testing the code that
        # was just written with zero network access during execution. Defense
        # in depth against the generated code itself trying to exfiltrate
        # anything, independent of whether the agent that wrote it was
        # trustworthy.
        #
        # Language-aware gate (2026-08-06, replaces the old `npm test
        # --if-present` line): the old gate passed any repo whose package.json
        # lacked a test script, so a backend that did not even compile (tsc
        # errors) sailed through — the 2026-07-29..08-01 event saw 0 of 5
        # turns across 2 teams ever run tests. Now: a node repo gets `npx tsc
        # --noEmit` when tsconfig.json exists and `npm test` when a test
        # script exists; a Python repo gets `python3 -m compileall` and pytest
        # when installed. Any failed check fails the turn.
        #
        # set +e + exit 0 here: a failed check must NOT skip the "Commit
        # progress" step below — the agent's work and the
        # VERIFICATION_FAILURE.log written here are committed and pushed
        # first, and the final "Report verification failure" step flips the
        # run's conclusion to 'failure'. reconcileBuildTurns reads that as
        # executed-and-failed (status 'completed', conclusion 'failure') —
        # counted, judged, and the team moves on; never 'cancelled', which
        # would misread the outcome and wedge the team.
        id: verify
        run: |
          set +e
          # Bounded retry (same A6 rationale as the install step): tsc /
          # compileall are deterministic, but a test run can fail transiently
          # (resource contention under the 2-CPU pids-limit, a test that
          # polls a port it bound microseconds too early). A deterministic
          # failure fails both attempts identically and still records
          # VERIFICATION_FAILURE.log for the next turn.
          ATTEMPTS=2
          code=0
          for attempt in $(seq 1 $ATTEMPTS); do
            docker run --rm \
              --cpus="2" --memory="4g" --memory-swap="4g" --pids-limit=50 \
              --network=none --read-only \
              --tmpfs /tmp:noexec,nosuid,size=200m,mode=1777 \
              --user="$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges:true \
              -e HOME=/tmp \
              -e PYTHONPATH=/workspace/.pydeps \
              -e PYTHONPYCACHEPREFIX=/tmp/pycache \
              -e TURN_ID="${{ github.event.inputs.turn_id || github.event.client_payload.turn_id }}" \
              -e INSTALL_EXIT_CODE="${{ steps.install.outputs.exit_code }}" \
              -v "${{ github.workspace }}:/workspace:rw" \
              -w /workspace \
              arena-team-base:latest \
              sh -c 'set +e
              VERIFY_FAILED=0
              ERRLOG=/tmp/verify-errors.log
              REPORT=/workspace/VERIFICATION_FAILURE.log
              NOTE=/workspace/VERIFICATION_NOTE.log
              rm -f "$ERRLOG" "$REPORT" "$NOTE"
              fail() {
                echo "::error::$1"
                echo "$1" >> "$ERRLOG"
                VERIFY_FAILED=1
              }
              # Warnings get committed too, as VERIFICATION_NOTE.log: "no tests
              # ran" is not a hard fail (turn 1 legitimately starts without a
              # suite), but it IS a standing requirement the next turn must
              # address — the turn prompt tells the agent to read this file.
              # git add -A in the Commit progress step picks it up automatically.
              note() {
                echo "::warning::$1"
                echo "turn $TURN_ID: $1" >> "$NOTE"
              }
              echo "--- language-aware verification (network=none) ---"
              echo "turn: $TURN_ID"
              if [ "$INSTALL_EXIT_CODE" != "0" ]; then
                fail "dependency install failed (install phase exit code $INSTALL_EXIT_CODE) — see the Phase B install step log; build checks skipped"
              elif [ -f package.json ]; then
                echo "[node] package.json present"
                if [ ! -d node_modules ]; then
                  fail "node_modules missing after the install phase — dependencies were not installed"
                else
                  if [ -f tsconfig.json ]; then
                    echo "[node] tsconfig.json present -> npx tsc --noEmit"
                    out=$(npx --no-install tsc --noEmit 2>&1)
                    code=$?
                    echo "$out"
                    if [ $code -ne 0 ]; then
                      echo "$out" >> "$ERRLOG"
                      fail "TypeScript type-check failed (npx tsc --noEmit) — if typescript is not in devDependencies, add it with: npm install --save-dev typescript"
                    else
                      echo "[node] type-check passed"
                    fi
                  else
                    echo "[node] no tsconfig.json — type-check skipped"
                  fi
                  if node -e "const p=require(\"./package.json\");process.exit(p.scripts&&p.scripts.test?0:1)"; then
                    echo "[node] test script present -> npm test"
                    out=$(npm test 2>&1)
                    code=$?
                    echo "$out"
                    if [ $code -ne 0 ]; then
                      echo "$out" >> "$ERRLOG"
                      fail "npm test failed (exit $code)"
                    else
                      echo "[node] tests passed"
                    fi
                  else
                    note "package.json has no test script — no tests ran this turn. The turn prompt requires every turn to add or extend at least one test; the next turn must create a test suite and a test script."
                  fi
                fi
              elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
                echo "[python] Python manifest present"
                out=$(python3 -m compileall -q -x "/(\.pydeps|\.git|\.github|\.pytest_cache)/" . 2>&1)
                code=$?
                echo "$out"
                if [ $code -ne 0 ]; then
                  echo "$out" >> "$ERRLOG"
                  fail "python3 -m compileall found syntax errors (exit $code)"
                else
                  echo "[python] byte-compile passed"
                fi
                if python3 -m pytest --version >/dev/null 2>&1; then
                  echo "[python] pytest installed -> python3 -m pytest -q"
                  out=$(python3 -m pytest -q -p no:cacheprovider 2>&1)
                  code=$?
                  echo "$out"
                  if [ $code -eq 0 ]; then
                    echo "[python] tests passed"
                  elif [ $code -eq 5 ]; then
                    note "pytest collected no tests — the turn prompt requires every turn to add or extend at least one test; the next turn must add real tests."
                  else
                    echo "$out" >> "$ERRLOG"
                    fail "pytest failed (exit $code)"
                  fi
                else
                  note "pytest not installed — only byte-compile ran (add pytest to requirements.txt to get a test gate; the turn prompt requires every turn to add or extend at least one test)."
                fi
              elif find . -name "*.py" -not -path "./.pydeps/*" -not -path "./.git/*" 2>/dev/null | grep -q .; then
                echo "[python] .py files present but no requirements.txt/pyproject.toml — byte-compiling anyway"
                out=$(python3 -m compileall -q -x "/(\.pydeps|\.git|\.github|\.pytest_cache)/" . 2>&1)
                code=$?
                echo "$out"
                if [ $code -ne 0 ]; then
                  echo "$out" >> "$ERRLOG"
                  fail "python3 -m compileall found syntax errors (exit $code)"
                else
                  echo "[python] byte-compile passed"
                fi
              else
                echo "no package.json, requirements.txt, pyproject.toml or Python files — nothing to build or test yet"
              fi
              if [ $VERIFY_FAILED -ne 0 ]; then
                {
                  echo "=== Build verification FAILED — turn $TURN_ID ==="
                  echo "Reported $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "This file is committed by the commit step so the next"
                  echo "turn can see what broke. Fix the checks below, then rebuild."
                  echo ""
                  cat "$ERRLOG"
                } > "$REPORT"
                exit 1
              fi
              echo "--- verification passed ---"
              exit 0'
            code=$?
            if [ $code -eq 0 ]; then
              echo "verification container succeeded on attempt $attempt"
              break
            fi
            echo "verification attempt $attempt of $ATTEMPTS failed (exit $code) — retrying once; a deterministic failure fails both attempts identically"
            sleep 10
          done
          if [ $code -ne 0 ]; then
            echo "verify_failed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "verification container exited $code (0 = checks passed, 1 = checks failed after $ATTEMPTS attempts — reported at the end so this turn's work is still committed)"
          exit 0

      - name: Commit progress
        run: |
          git config user.name "arena-bot[${{ github.event.inputs.team || github.event.client_payload.team }}]"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build turn ${{ github.event.inputs.turn_id || github.event.client_payload.turn_id }}"
          git push

      - name: Upload turn log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-turn-${{ github.event.inputs.turn_id || github.event.client_payload.turn_id }}
          path: |
            opencode-turn.log
            opencode-turn.err.log
            **/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Report agent crash (after the work was preserved)
        # Runs last on purpose (only the verification-failure report below
        # runs after it). If opencode crashed but still produced files,
        # everything above has already verified, committed and pushed that
        # work — the next turn continues from it instead of redoing it. The
        # turn is still reported as failed, because it did fail: honest CI
        # status, without throwing away real progress to get it.
        if: steps.agent.outputs.exit_code != '0'
        run: |
          if [ "${{ steps.agent.outputs.timed_out }}" = "1" ]; then
            echo "::error::Agent was killed by the silence watchdog (no output and no file changes for 10+ minutes) instead of burning the full job timeout. This turn records a real failure — the scheduler dispatches the next turn minutes from now rather than 2 hours from now. Any files produced before the stall were committed and pushed."
          else
            echo "::error::opencode exited ${{ steps.agent.outputs.exit_code }}. Any files it produced before crashing were committed and pushed; this turn is reported failed so the outcome is not silently treated as success."
          fi
          exit 1

      - name: Report verification failure (after the work was preserved)
        # Runs last on purpose, same shape as "Report agent crash" above: the
        # verification step exits 0 so "Commit progress" has already committed
        # and pushed the agent's work along with VERIFICATION_FAILURE.log —
        # which is what the NEXT turn's agent reads to see what broke. This
        # step is what flips the run's conclusion to 'failure':
        # reconcileBuildTurns records status='completed' + conclusion='failure',
        # which counts as executed (the judge sees it, the team advances) —
        # never 'cancelled', which would misread the outcome.
        if: steps.verify.outputs.verify_failed == 'true'
        run: |
          echo "::error::Build verification FAILED this turn — see the Phase B verification step log above and the committed VERIFICATION_FAILURE.log. The agent's work was committed and pushed; this turn is reported failed so the outcome is not silently treated as success."
          exit 1
