name: Artifact audit

# The 2026-10-31 baseline was a point-in-time check. The failure shape it
# catches (an event closes while its ideas/critiques/repos are empty or
# structurally unusable) recurs every cycle, so this runs daily and records the
# result in event_quality. It is deliberately outside the Worker: build-repo
# checks need GitHub tree/content reads and must not consume the invocation's
# 50-subrequest budget.
#
# `--strict` makes a missing contract a red workflow, not a green job with a
# bad line in the log. `--persist` is the only write, and it targets the
# event_quality row for the audited events.
#
# Requires repo secrets CF_ACCOUNT_ID and CF_API_TOKEN (already present for
# deploy-worker/deploy-pages). Runs on the default branch, newest judged
# ideathon; when that judged ideathon has no complete child with repos it falls
# back to the latest complete hackathon and says so in the output.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit artifacts and persist per-event result
        shell: bash
        run: |
          set -o pipefail
          node scripts/artifact_audit.mjs --persist --strict | tee audit.txt
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Snapshot ranking quality
        # Safety net for events judged before the Worker's snapshot hook
        # existed. The hook writes at transition; this refreshes every terminal
        # event from the live API and makes Headroom's history current.
        if: always()
        run: node scripts/snapshot_event_quality.mjs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ARENA_API_BASE: https://arena-api.sadi21863.workers.dev

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if [ -f audit.txt ]; then
            {
              echo "## Artifact audit"
              echo '```'
              cat audit.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify webhook on audit failure
        # Task 11: a strict audit failure is now expected on zero-success
        # cycles. Without this it is only a red badge in the Actions tab.
        if: failure()
        shell: bash
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "::warning::ALERT_WEBHOOK_URL is not configured in repo secrets; audit failure remains in the step summary only"
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TEXT="[CRITICAL] Artifact audit failed for $GITHUB_REPOSITORY: $RUN_URL"
          PAYLOAD=$(jq -n --arg text "$TEXT" --arg run_url "$RUN_URL" '{text:$text, content:$text, kind:"artifact_audit_failure", severity:"critical", run_url:$run_url}')
          curl -sS -m 15 -H "Content-Type: application/json" -d "$PAYLOAD" "$ALERT_WEBHOOK_URL" \
            || echo "::warning::audit failure webhook delivery failed"
