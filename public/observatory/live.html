<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem("arena-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>Live — The Arena Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/arena.css" />
<script src="/js/theme.js" defer></script>
<style>
  .obs-header { padding: 48px 32px 24px; }
  .obs-header h1 { font-size: clamp(2rem, 4vw, 3rem); }
  .obs-header p { color: var(--arena-ink-soft); max-width: 60ch; margin-top: 10px; font-size: 1.02rem; }

  .live-wrap { max-width: 920px; margin: 0 auto; padding: 0 32px 72px; }

  /* --- Hero status --- */
  .hero-card { padding: 36px 36px 32px; margin-bottom: 28px; }
  .hero-card__eyebrow {
    font-family: var(--arena-font-mono); font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--arena-ink-faint); display: flex; align-items: center; gap: 8px;
  }
  .hero-card__title { font-size: clamp(1.6rem, 3.6vw, 2.4rem); margin: 10px 0 6px; }
  .hero-card__sub { color: var(--arena-ink-soft); font-size: 1rem; }
  .hero-card__links { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .hero-card__links a {
    font-family: var(--arena-font-mono); font-size: 0.8rem; text-decoration: none;
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--arena-line-strong);
    color: var(--arena-ink-soft); transition: color 0.15s ease, border-color 0.15s ease;
  }
  .hero-card__links a:hover { color: var(--arena-clay-deep); border-color: var(--arena-clay-deep); }

  /* --- Pulse dot: live vs finished --- */
  .pulse-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .pulse-dot--live { background: var(--arena-ink-green); animation: arena-pulse 2s ease-in-out infinite; }
  .pulse-dot--done { background: var(--arena-ink-faint); }

  /* --- Pipeline stepper --- */
  .stepper { display: flex; flex-wrap: wrap; gap: 0; margin-top: 26px; }
  .step {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 0;
    font-family: var(--arena-font-mono); font-size: 0.74rem; color: var(--arena-ink-faint);
    position: relative;
  }
  .step:not(:last-child)::after {
    content: "→"; margin-left: 6px; color: var(--arena-line-strong);
  }
  .step__dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--arena-line-strong); flex: none; background: var(--arena-bg); }
  .step.is-done .step__dot { background: var(--arena-ink-green); border-color: var(--arena-ink-green); }
  .step.is-current { color: var(--arena-ink); }
  .step.is-current .step__dot { background: var(--arena-clay); border-color: var(--arena-clay); box-shadow: 0 0 0 4px color-mix(in srgb, var(--arena-clay) 18%, transparent); }

  /* --- Queue health meter --- */
  .meter-card { padding: 28px 32px; margin-bottom: 20px; }
  .meter-card__label {
    font-family: var(--arena-font-mono); font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--arena-ink-faint); margin-bottom: 14px;
  }
  .meter-bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--arena-bg-sunken); }
  .meter-seg { height: 100%; transition: width 0.5s ease; }
  .meter-seg--done { background: var(--arena-ink-green); }
  .meter-seg--progress { background: var(--arena-gold); }
  .meter-seg--pending { background: var(--arena-line-strong); }
  .meter-seg--failed { background: var(--arena-danger); }
  .meter-legend { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; }
  .meter-legend__item { display: flex; align-items: center; gap: 7px; font-family: var(--arena-font-mono); font-size: 0.78rem; color: var(--arena-ink-soft); }
  .meter-legend__swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }

  /* --- Recent events list --- */
  .recent-label {
    font-family: var(--arena-font-mono); font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--arena-ink-faint); margin: 8px 0 12px;
  }
  .recent-item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px; margin-bottom: 8px; text-decoration: none;
  }
  .recent-item__left { display: flex; align-items: center; gap: 10px; }
  .recent-item__type { font-family: var(--arena-font-display); font-size: 0.98rem; color: var(--arena-ink); }
  .recent-item__status { font-family: var(--arena-font-mono); font-size: 0.75rem; color: var(--arena-ink-faint); }
  .recent-item__arrow { color: var(--arena-ink-faint); font-family: var(--arena-font-mono); }

  .empty-state, .loading-state { padding: 60px 0; text-align: center; color: var(--arena-ink-faint); font-family: var(--arena-font-mono); font-size: 0.85rem; }

  /* --- Skeleton (first load only) --- */
  @keyframes arena-skeleton-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .skel { border-radius: 6px; background: var(--arena-bg-sunken); animation: arena-skeleton-pulse 1.6s ease-in-out infinite; }
  .skel-card { padding: 36px; }
  .skel-eyebrow { width: 100px; height: 10px; margin-bottom: 16px; }
  .skel-title { width: 60%; height: 28px; margin-bottom: 10px; }
  .skel-sub { width: 40%; height: 12px; margin-bottom: 22px; }
  .skel-steps { display: flex; gap: 10px; }
  .skel-step { width: 90px; height: 20px; border-radius: 999px; }
  .skel-meter { height: 10px; border-radius: 6px; margin-bottom: 20px; }

  .freshness { font-family: var(--arena-font-mono); font-size: 0.72rem; color: var(--arena-ink-faint); text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<div class="arena-grain" aria-hidden="true"></div>

<nav class="arena-nav">
  <a href="/" class="arena-nav__mark">The Arena</a>
  <div class="arena-nav__links">
    <a href="/observatory/live.html" aria-current="page">Live</a>
    <a href="/observatory/agents.html">Agent Graph</a>
    <a href="/observatory/headroom.html">Headroom</a>
    <a href="/observatory/replay.html">Replay</a>
    <a href="/observatory/diff.html">Diff</a>
    <a href="/observatory/tribunal.html">Tribunal</a>
    <a href="https://arena-api.sadi21863.workers.dev/health">API</a>
  </div>
  <button class="arena-theme-toggle" aria-label="Toggle dark mode" type="button">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</nav>

<header class="obs-header">
  <div class="scene__eyebrow" style="text-align:left;">Observatory · spec §11</div>
  <h1>Live</h1>
  <p>What's actually happening right now — the current or most recent event's real phase, straight from the same day-math the live cron uses, not a stale summary.</p>
</header>

<div class="live-wrap" id="content">
  <div class="arena-card skel-card">
    <div class="skel skel-eyebrow"></div>
    <div class="skel skel-title"></div>
    <div class="skel skel-sub"></div>
    <div class="skel-steps">
      <div class="skel skel-step"></div><div class="skel skel-step"></div><div class="skel skel-step"></div>
    </div>
  </div>
  <div class="skel skel-meter"></div>
</div>
<p class="freshness" id="freshness"></p>

<footer class="arena-footer">The Arena Observatory · <a href="/">back home</a></footer>

<script>
(function () {
  var API = "https://arena-api.sadi21863.workers.dev";
  var content = document.getElementById("content");

  var IDEATHON_STEPS = [
    ["deep_research", "Deep Research"],
    ["ideation_critique", "Ideation + Critique"],
    ["architecture", "Architecture"],
    ["ready_for_judging", "Judging"],
    ["judged", "Judged"],
  ];
  var HACKATHON_STEPS = [
    ["team_formation", "Team Formation"],
    ["building", "Building"],
    ["ready_for_judging", "Judging"],
    ["judged", "Judged"],
    ["tribunal", "Tribunal"],
    ["complete", "Complete"],
  ];

  var TERMINAL = { judged: "ideathon", complete: "hackathon" }; // status -> which type it's terminal FOR

  function isLive(event) {
    if (event.type === "ideathon") return event.status !== "judged";
    return event.status !== "complete";
  }

  function renderStepper(event) {
    var steps = event.type === "ideathon" ? IDEATHON_STEPS : HACKATHON_STEPS;
    var currentIdx = steps.findIndex(function (s) { return s[0] === event.status; });
    var html = '<div class="stepper">';
    steps.forEach(function (s, i) {
      var cls = i < currentIdx ? "is-done" : i === currentIdx ? "is-current" : "";
      html += '<div class="step ' + cls + '"><span class="step__dot"></span>' + s[1] + '</div>';
    });
    html += '</div>';
    return html;
  }

  function phaseLabel(event) {
    var steps = event.type === "ideathon" ? IDEATHON_STEPS : HACKATHON_STEPS;
    var match = steps.find(function (s) { return s[0] === event.status; });
    return match ? match[1] : event.status;
  }

  function renderMeter(counts) {
    var total = counts.pending + counts.in_progress + counts.completed + counts.failed;
    if (total === 0) return '';
    function pct(n) { return (n / total * 100).toFixed(1) + "%"; }
    return '' +
      '<div class="arena-card meter-card">' +
        '<div class="meter-card__label">Queue health · this event</div>' +
        '<div class="meter-bar">' +
          '<div class="meter-seg meter-seg--done" style="width:' + pct(counts.completed) + '"></div>' +
          '<div class="meter-seg meter-seg--progress" style="width:' + pct(counts.in_progress) + '"></div>' +
          '<div class="meter-seg meter-seg--pending" style="width:' + pct(counts.pending) + '"></div>' +
          '<div class="meter-seg meter-seg--failed" style="width:' + pct(counts.failed) + '"></div>' +
        '</div>' +
        '<div class="meter-legend">' +
          '<div class="meter-legend__item"><span class="meter-legend__swatch" style="background:var(--arena-ink-green)"></span>' + counts.completed + ' completed</div>' +
          '<div class="meter-legend__item"><span class="meter-legend__swatch" style="background:var(--arena-gold)"></span>' + counts.in_progress + ' in progress</div>' +
          '<div class="meter-legend__item"><span class="meter-legend__swatch" style="background:var(--arena-line-strong)"></span>' + counts.pending + ' pending</div>' +
          '<div class="meter-legend__item"><span class="meter-legend__swatch" style="background:var(--arena-danger)"></span>' + counts.failed + ' failed</div>' +
        '</div>' +
      '</div>';
  }

  function escapeHtml(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function load() {
    fetch(API + "/events")
      .then(function (r) { return r.json(); })
      .then(function (events) {
        if (!events.length) {
          content.innerHTML = '<div class="empty-state">No events yet — nothing has run.</div>';
          return;
        }
        var current = events[0]; // most recently created — the active or most-recent event
        var rest = events.slice(1, 6);

        var live = isLive(current);
        var typeLabel = current.type === "ideathon" ? "Ideathon" : "Hackathon";

        Promise.all([
          fetch(API + "/events/" + current.id + "/queue-status").then(function (r) { return r.json(); }).catch(function () { return null; })
        ]).then(function (results) {
          var counts = results[0];
          var html = '';

          html += '<div class="arena-card hero-card">' +
            '<div class="hero-card__eyebrow"><span class="pulse-dot ' + (live ? "pulse-dot--live" : "pulse-dot--done") + '"></span>' +
              (live ? "In progress" : "Most recent · finished") + '</div>' +
            '<h2 class="hero-card__title">' + typeLabel + ' — ' + escapeHtml(phaseLabel(current)) + '</h2>' +
            '<p class="hero-card__sub">' + escapeHtml(current.id) + ' · started ' + escapeHtml((current.start_date || current.created_at || "").slice(0, 16)) + ' UTC</p>' +
            renderStepper(current) +
            '<div class="hero-card__links">' +
              // Hackathon events have zero critique/collaboration edges of
              // their own (those only happen during ideathon phases) --
              // link to the parent ideathon's graph instead, or omit the
              // link entirely if there's no parent to fall back to.
              (current.type === "ideathon"
                ? '<a href="/observatory/agents.html?event_id=' + encodeURIComponent(current.id) + '">Agent Graph for this event →</a>'
                : current.parent_event_id
                  ? '<a href="/observatory/agents.html?event_id=' + encodeURIComponent(current.parent_event_id) + '">Agent Graph (parent ideathon) →</a>'
                  : '') +
              '<a href="/observatory/replay.html">Replay →</a>' +
              (current.type === "hackathon" ? '<a href="/observatory/diff.html">Diff Viewer →</a><a href="/observatory/tribunal.html">Tribunal →</a>' : '') +
            '</div>' +
          '</div>';

          if (counts) html += renderMeter(counts);

          if (rest.length) {
            html += '<div class="recent-label">Earlier events</div>';
            rest.forEach(function (e) {
              html += '<a class="arena-card recent-item" href="/observatory/replay.html">' +
                '<div class="recent-item__left">' +
                  '<span class="pulse-dot ' + (isLive(e) ? "pulse-dot--live" : "pulse-dot--done") + '"></span>' +
                  '<span class="recent-item__type">' + (e.type === "ideathon" ? "Ideathon" : "Hackathon") + '</span>' +
                  '<span class="recent-item__status">' + escapeHtml(phaseLabel(e)) + '</span>' +
                '</div>' +
                '<span class="recent-item__arrow">' + escapeHtml(e.id.slice(0, 14)) + '…</span>' +
              '</a>';
            });
          }

          content.innerHTML = html;
          lastLoadedAt = Date.now();
        });
      })
      .catch(function (err) {
        content.innerHTML = '<div class="empty-state">Couldn\'t load live status (' + err.message + ').</div>';
      });
  }

  // Visibility-aware polling, ported from a pattern in a sibling project's
  // AI Lab refresher: don't burn fetches on a backgrounded tab, and catch
  // up immediately (not after up to 30s of staleness) when the tab regains
  // focus. A plain unconditional setInterval was the previous behavior.
  var lastLoadedAt = null;
  var freshnessEl = document.getElementById("freshness");

  function tickFreshness() {
    if (!lastLoadedAt) return;
    var secs = Math.round((Date.now() - lastLoadedAt) / 1000);
    freshnessEl.textContent = "Updated " + (secs < 2 ? "just now" : secs + "s ago") + " · refreshes every 30s";
  }

  load();
  setInterval(tickFreshness, 1000);
  setInterval(function () {
    if (document.visibilityState === "visible") load();
  }, 30000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") load();
  });
})();
</script>
</body>
</html>
