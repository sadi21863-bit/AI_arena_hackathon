name: Product CI

# The product's own quality gate — separate from the arena's build-turn
# harness (.github/workflows/team-build-turn.yml, which the arena re-syncs
# before every turn; do not edit that file). Stack-detecting: runs the Node
# toolchain if package.json exists, the Python toolchain if pyproject.toml
# or requirements.txt exists, otherwise no-ops (e.g. on the arena's own
# scaffold commit). Fails loudly — a red CI on a pushed commit is a real
# signal the build is broken.

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node stack (package.json)
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          if [ -f tsconfig.json ]; then npx tsc --noEmit; fi
          npm test --if-present

      - name: Python stack (pyproject.toml / requirements.txt)
        if: hashFiles('package.json') == '' && (hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != '')
        run: |
          if [ -f requirements.txt ]; then python3 -m pip install --quiet -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python3 -m pip install --quiet .; fi
          if find . \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null | grep -q .; then
            python3 -m pytest -q
          else
            python3 -m compileall -q .
          fi
